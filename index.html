<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entre Nós</title>
  <meta name="theme-color" content="#fcf9f5">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Manrope:wght@400..800&display=swap"
    rel="stylesheet">
  <!-- Estilos -->
  <link rel="stylesheet" href="styles-refinado.css?v=2.3">
</head>

<body>

  <div class="app-shell">
    <header class="topbar">
      <a href="#" class="brand" data-action="home">
        <span class="brand-symbol">e.</span>
        <span>entre nós</span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        <button type="button" class="nav-button is-active" data-page="decks" data-action="home" aria-current="page">Baralhos</button>
        <button type="button" class="nav-button" data-page="history">Histórico</button>
        <button type="button" class="nav-button" data-page="favorites">Salvas</button>
      </nav>
      <button type="button" class="theme-toggle" data-action="toggle-theme" aria-pressed="false"
        aria-label="Alternar tema">
        <svg class="icon icon-moon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </header>

    <main id="app" tabindex="-1">
      <!-- O conteúdo dinâmico é injetado aqui pelo app.js -->
    </main>

    <footer class="footer">
      <span>Feito para estar presente.</span>
      <span>Perguntas originais. Respostas só suas.</span>
    </footer>
  </div>

  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

  <!-- JavaScript com versão para forçar atualização no GitHub Pages -->
  <script src="app.js?v=2.3"></script>
  <script src="efeitos.js"></script>
</body>

</html>
