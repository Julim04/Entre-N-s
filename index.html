<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f2eb" />
    <meta
      name="description"
      content="Um espaço original para puxar perguntas, conversar e guardar suas favoritas."
    />
    <title>Entre Nós — Perguntas para boas conversas</title>

    <!-- Aplica o tema salvo (ou o do sistema) antes da primeira pintura, evitando o "flash" -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("entre-nos-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (theme === "dark") {
            document.documentElement.classList.add("theme-dark");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#11150f");
          }
        } catch (error) {
          /* sem localStorage: segue com o tema claro */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a
          class="brand"
          href="#"
          data-action="home"
          aria-label="Entre Nós, início"
        >
          <span class="brand-symbol" aria-hidden="true">e.</span>
          <span>entre nós</span>
        </a>

        <nav class="main-nav" aria-label="Navegação principal">
          <button
            class="nav-button is-active"
            type="button"
            data-page="decks"
            aria-current="page"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 2 10 5-10 5L2 7l10-5z" />
              <path d="m2 17 10 5 10-5" />
              <path d="m2 12 10 5 10-5" />
            </svg>
            <span>Baralhos</span>
          </button>
          <button class="nav-button" type="button" data-page="history">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9.5" />
              <path d="M12 6.5V12l3.5 2" />
            </svg>
            <span>Histórico</span>
          </button>
          <button class="nav-button" type="button" data-page="favorites">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
              />
            </svg>
            <span>Salvas</span>
          </button>
        </nav>

        <button
          class="theme-toggle"
          type="button"
          data-action="toggle-theme"
          aria-pressed="false"
          aria-label="Modo escuro"
          title="Alternar entre modo claro e escuro"
        >
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        </button>
      </header>

      <div
        id="notice"
        class="notice"
        role="status"
        aria-live="polite"
        hidden
      ></div>
      <main id="app" tabindex="-1"></main>

      <footer class="footer">
        <span>Feito para estar presente.</span>
        <span>Perguntas originais. Respostas só suas.</span>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
